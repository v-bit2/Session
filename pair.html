<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>VOLTRA MD - WhatsApp Linker</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css"/>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #04060f;
      --bg-2: #070b1c;
      --surface: #0b1024;
      --surface-2: #111a3a;
      --border: rgba(59, 130, 246, 0.22);
      --primary: #2563eb;
      --primary-glow: #3b82f6;
      --accent: #60a5fa;
      --text: #e6ecff;
      --muted: #8aa0d0;
      --danger: #ff5566;
      --success: #38bdf8;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      font-family: 'Inter', system-ui, sans-serif;
      color: var(--text);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 16px;
      background:
        radial-gradient(1200px 600px at 80% -10%, rgba(37,99,235,0.25), transparent 60%),
        radial-gradient(900px 500px at -10% 110%, rgba(59,130,246,0.18), transparent 60%),
        linear-gradient(160deg, var(--bg) 0%, var(--bg-2) 100%);
    }

    .container {
      width: 100%;
      max-width: 460px;
      background: linear-gradient(180deg, rgba(17,26,58,0.85), rgba(11,16,36,0.85));
      backdrop-filter: blur(14px);
      border-radius: 20px;
      padding: 28px;
      border: 1px solid var(--border);
      box-shadow:
        0 10px 30px rgba(0,0,0,0.5),
        0 0 0 1px rgba(59,130,246,0.08) inset,
        0 0 60px rgba(37,99,235,0.18);
    }

    .header { text-align: center; margin-bottom: 22px; }

    .logo {
      width: 76px; height: 76px;
      margin: 0 auto 14px;
      border-radius: 20px;
      display: flex; align-items: center; justify-content: center;
      font-size: 30px; color: #fff;
      background: linear-gradient(135deg, var(--primary), var(--primary-glow));
      box-shadow: 0 8px 24px rgba(37,99,235,0.45), inset 0 0 0 1px rgba(255,255,255,0.15);
    }

    .title {
      font-size: 26px; font-weight: 800; letter-spacing: 0.4px;
      background: linear-gradient(90deg, #ffffff, #93c5fd);
      -webkit-background-clip: text; background-clip: text; color: transparent;
      margin-bottom: 6px;
    }
    .subtitle { font-size: 13.5px; color: var(--muted); }

    .toggle-container {
      display: flex; align-items: center; justify-content: center;
      margin: 18px 0 22px;
      background: rgba(7,11,28,0.7);
      border-radius: 14px; padding: 5px;
      border: 1px solid var(--border);
    }
    .toggle-option {
      flex: 1; padding: 10px 14px; text-align: center; cursor: pointer;
      border-radius: 10px; font-size: 14px; font-weight: 600;
      color: var(--muted); transition: all .25s ease;
    }
    .toggle-option.active {
      background: linear-gradient(135deg, var(--primary), var(--primary-glow));
      color: #fff;
      box-shadow: 0 6px 18px rgba(37,99,235,0.45);
    }
    .toggle-option:hover:not(.active) { color: var(--text); }

    .input-group { margin-bottom: 18px; transition: all .3s ease; }
    .input-group.hidden { display: none; }
    .input-label { display: block; margin-bottom: 8px; font-weight: 500; font-size: 13px; color: var(--muted); }
    .input-field {
      width: 100%; padding: 13px 14px;
      border: 1.5px solid var(--border); border-radius: 12px;
      background: rgba(4,6,15,0.7);
      color: var(--text);
      font-size: 15px;
      transition: border-color .2s, box-shadow .2s;
    }
    .input-field::placeholder { color: #4f608c; }
    .input-field:focus {
      outline: none;
      border-color: var(--primary-glow);
      box-shadow: 0 0 0 3px rgba(59,130,246,0.18);
    }

    .generate-btn {
      width: 100%; padding: 13px; border: none; border-radius: 12px;
      color: #fff; font-size: 15px; font-weight: 700; cursor: pointer;
      background: linear-gradient(135deg, var(--primary), var(--primary-glow));
      box-shadow: 0 10px 24px rgba(37,99,235,0.4);
      transition: transform .15s ease, box-shadow .2s ease;
      margin-bottom: 14px;
    }
    .generate-btn:hover { transform: translateY(-1px); box-shadow: 0 14px 28px rgba(37,99,235,0.55); }
    .generate-btn.hidden { display: none; }

    .code-display {
      background: rgba(4,6,15,0.7);
      padding: 14px; border-radius: 12px; text-align: center;
      font-size: 18px; font-weight: 700; letter-spacing: 2px;
      margin-bottom: 14px; min-height: 50px;
      display: flex; align-items: center; justify-content: center;
      border: 1.5px solid var(--border);
      color: var(--accent);
      font-family: 'JetBrains Mono', ui-monospace, monospace;
    }

    .qr-display {
      background: rgba(255,255,255,0.04);
      padding: 24px; border-radius: 12px; text-align: center;
      margin-bottom: 14px; border: 1.5px solid var(--border); display: none;
    }
    .qr-image {
      max-width: 260px; max-height: 260px;
      margin: 0 auto 16px; border-radius: 12px;
      box-shadow: 0 6px 24px rgba(0,0,0,0.45);
      background: #fff; padding: 8px;
    }
    .qr-instructions { font-size: 13px; color: var(--muted); line-height: 1.5; }

    .copy-btn {
      width: 100%; padding: 12px;
      background: rgba(37,99,235,0.1);
      border: 1.5px solid var(--border); border-radius: 12px;
      color: var(--accent);
      font-size: 14px; font-weight: 600; cursor: pointer;
      display: flex; align-items: center; justify-content: center; gap: 8px;
      transition: background .2s, border-color .2s;
    }
    .copy-btn:hover { background: rgba(37,99,235,0.18); border-color: var(--primary-glow); }

    .success-message { color: var(--success); display: flex; align-items: center; justify-content: center; gap: 8px; font-size: 15px; }
    .error-message   { color: var(--danger);  display: flex; align-items: center; justify-content: center; gap: 8px; font-size: 14px; }

    .loading { display: none; text-align: center; margin: 14px 0; }
    .loading i { font-size: 26px; color: var(--primary-glow); animation: spin 1s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }

    .footer { text-align: center; margin-top: 20px; font-size: 12px; color: var(--muted); }
    .footer b { color: var(--accent); }

    @media (max-width: 480px) {
      .container { padding: 22px; border-radius: 16px; }
      .qr-image { max-width: 220px; max-height: 220px; }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <div class="logo"><i class="fas fa-bolt"></i></div>
      <h1 class="title">VOLTRA MD</h1>
      <p class="subtitle">Link your WhatsApp device securely</p>
    </div>

    <div class="toggle-container">
      <div class="toggle-option active" data-mode="pair"><i class="fas fa-key"></i> Pair Code</div>
      <div class="toggle-option" data-mode="qr"><i class="fas fa-qrcode"></i> QR Code</div>
    </div>

    <div class="input-group" id="inputGroup">
      <label class="input-label">WhatsApp number with country code</label>
      <input type="text" id="mobileNumber" class="input-field" placeholder="e.g. 2348012345678" />
    </div>

    <button class="generate-btn" id="submit">
      <i class="fas fa-key"></i> Generate Pair Code
    </button>

    <div class="loading" id="loading"><i class="fas fa-spinner"></i></div>

    <div class="code-display" id="codeDisplay">VOLT-RAMD</div>

    <div class="qr-display" id="qrDisplay">
      <img id="qrImage" class="qr-image" src="" alt="QR Code">
      <div class="qr-instructions">Open WhatsApp → Linked Devices → Link a device</div>
    </div>

    <button class="copy-btn" id="copy" onclick="copyCode()">
      <i class="fas fa-copy"></i> Copy Code
    </button>

    <div class="footer">
      <p>© 2025 <b>Drey</b> · VOLTRA MD</p>
    </div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/axios/1.6.0/axios.min.js"></script>
  <script>
    let currentMode = 'pair';

    document.querySelectorAll('.toggle-option').forEach(option => {
      option.addEventListener('click', function() {
        const mode = this.dataset.mode;
        if (mode === currentMode) return;
        document.querySelectorAll('.toggle-option').forEach(opt => opt.classList.remove('active'));
        this.classList.add('active');
        currentMode = mode;

        const submitBtn = document.getElementById('submit');
        const inputGroup = document.getElementById('inputGroup');
        const codeDisplay = document.getElementById('codeDisplay');
        const qrDisplay = document.getElementById('qrDisplay');

        if (mode === 'pair') {
          submitBtn.innerHTML = '<i class="fas fa-key"></i> Generate Pair Code';
          submitBtn.classList.remove('hidden');
          inputGroup.classList.remove('hidden');
          codeDisplay.style.display = 'flex';
          codeDisplay.innerHTML = 'VOLT-RAMD';
          qrDisplay.style.display = 'none';
        } else {
          submitBtn.classList.add('hidden');
          inputGroup.classList.add('hidden');
          codeDisplay.style.display = 'none';
          generateQRCode();
        }
      });
    });

    document.getElementById('submit').addEventListener('click', async () => {
      const num = document.getElementById('mobileNumber').value.trim();
      if (!num) {
        document.getElementById('codeDisplay').innerHTML =
          '<span class="error-message"><i class="fas fa-exclamation-circle"></i> Enter your number</span>';
        return;
      }
      document.getElementById('loading').style.display = 'block';
      document.getElementById('codeDisplay').innerHTML = '...';
      try {
        const { data } = await axios.get('/pair?number=' + encodeURIComponent(num));
        document.getElementById('codeDisplay').innerHTML =
          '<span class="success-message">' + (data.code || 'No code') + '</span>';
      } catch (e) {
        document.getElementById('codeDisplay').innerHTML =
          '<span class="error-message"><i class="fas fa-exclamation-circle"></i> ' +
          (e.response?.data?.code || 'Service unavailable') + '</span>';
      } finally {
        document.getElementById('loading').style.display = 'none';
      }
    });

    async function generateQRCode() {
      const qrDisplay = document.getElementById('qrDisplay');
      const qrImage = document.getElementById('qrImage');
      qrDisplay.style.display = 'block';
      document.getElementById('loading').style.display = 'block';
      try {
        const { data } = await axios.get('/qr');
        qrImage.src = data.qr;
      } catch (e) {
        qrDisplay.innerHTML = '<div class="error-message"><i class="fas fa-exclamation-circle"></i> Failed to load QR</div>';
      } finally {
        document.getElementById('loading').style.display = 'none';
      }
    }

    function copyCode() {
      const code = document.getElementById('codeDisplay').innerText.trim();
      if (!code || code === '...') return;
      navigator.clipboard.writeText(code).then(() => {
        const btn = document.getElementById('copy');
        const html = btn.innerHTML;
        btn.innerHTML = '<i class="fas fa-check"></i> Copied!';
        setTimeout(() => (btn.innerHTML = html), 1500);
      });
    }
  </script>
</body>
</html>
